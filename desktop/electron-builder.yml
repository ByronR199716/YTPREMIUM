# YTPremium para computadora (basado en NouTube Desktop, AGPL-3.0).
appId: ec.ytpremium.desktop
productName: YTPremium
copyright: Basado en NouTube (Nonbili Inc.), software libre bajo licencia AGPL-3.0
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!changelogs/*'
asarUnpack:
  - resources/**
win:
  executableName: YTPremium
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: YTPremium-${version}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: YTPremium
  uninstallDisplayName: YTPremium
  createDesktopShortcut: always
  createStartMenuShortcut: true
  language: '3082'
  installerLanguages: [es_ES]
mac:
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: YTPremium-${version}-${arch}.${ext}
linux:
  executableName: ytpremium
  executableArgs:
    - --ozone-platform=x11
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: YTPremium-${version}.${ext}
npmRebuild: false
# Sin "publish": la app no busca actualizaciones (ver src/main/lib/auto-update.ts).
publish: null
