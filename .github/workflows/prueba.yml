name: Compilar APK de PRUEBA (YTPremium)

# APK de PRUEBA: se ejecuta al subir cambios a la rama `prueba`.
# NO se marca como "latest": el enlace fijo (releases/latest/download/YTPremium.apk),
# los enlaces aftv.news y el aviso de actualización siguen entregando la versión oficial.
on:
  workflow_dispatch:
  push:
    branches: [ 'prueba' ]
    paths-ignore:
      - '**.md'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-apk-prueba
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, firmar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos de firma
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in BASE_64_SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
          echo "$BASE_64_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/firma.jks"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Versión de esta compilación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mismo versionCode que la última compilación OFICIAL (build.yml, aunque siga en curso):
          # la prueba se instala encima de la oficial y la siguiente oficial se instala encima
          # de la prueba (Android solo rechaza versiones menores, no iguales).
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=1" --jq '.workflow_runs[0].run_number')
          case "$N" in ''|*[!0-9]*) echo "::error::No se pudo leer la última versión oficial"; exit 1;; esac
          jq --argjson vc "$((100 + N))" --arg v "1.0.$N-prueba.${{ github.run_number }}" \
            '.versionCode = $vc | .version = $v' package.json > package.tmp && mv package.tmp package.json
          echo "VERSION=1.0.$N-prueba.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BASE=1.0.$N" >> "$GITHUB_ENV"

      - name: Instalar dependencias y preparar Android
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleFullRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Firmar APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p salida
          DIR=android/app/build/outputs/apk/full/release
          ls -la "$DIR"
          firmar() {
            "$BT/zipalign" -f -p 4 "$1" salida/alineado.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/firma.jks" --ks-pass env:KEY_STORE_PASSWORD \
              --ks-key-alias "$ALIAS" --key-pass env:KEY_PASSWORD \
              --out "$2" salida/alineado.apk
            rm salida/alineado.apk
            "$BT/apksigner" verify "$2"
          }
          # Sin copia YTPremium.apk de nombre fijo: eso es solo para la versión oficial.
          firmar "$(ls $DIR/*arm64-v8a*.apk | head -n 1)" "salida/YTPremium-$VERSION.apk"
          # armeabi-v7a (teléfonos viejos de 32 bits): la app cambia el enlace sola si hace falta.
          V7=$(ls $DIR/*armeabi-v7a*.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$V7" ]; then firmar "$V7" "salida/YTPremium-$VERSION-armeabi-v7a.apk"; fi
          ls -la salida

      - name: Guardar APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: YTPremium-prueba-apk
          path: salida/*.apk

      - name: Publicar APK de prueba (NO es la versión oficial)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PRUEBA YTPremium ${{ env.VERSION }}
          prerelease: true
          make_latest: false
          body: |
            APK de PRUEBA (rama `prueba`, commit ${{ github.sha }}). Solo para probar en el teléfono propio, no para clientes.
            Mismo número de versión que la oficial ${{ env.BASE }}: se instala encima sin perder datos.
          files: salida/*.apk
